[api]
api_key = ""
enabled = false
host = "127.0.0.1"
port = 3000
webhook_secret = ""

[browser]
headless = true

[continuous_learning]
auto_store_episodes = true
episodic_memory_enabled = true
max_episodes_in_context = 5
profile_decay_days = 30
profile_decay_factor = 0.9
semantic_profiles_enabled = true

[dashboard]
enabled = true
password = ""
port = 8080
username = ""

[faceless_yt]
background_music_dir = "./assets/music"
burn_subtitles = true
default_format = "16:9"
default_model = ""
enabled = true
example_topic = ""
generate_subtitles = true
languages = "en"
max_video_duration_secs = 300
niche = "world news"
output_dir = "./workspace/yt_videos"
pexels_api_key = ""
tts_voice_en = ""
tts_voice_fr = ""
youtube_upload = false

[general]
audit_db = "ironclad_audit.db"
log_level = "info"
workspace_dir = "./scratchpad"

[integrations.remote_agents]
enabled = false
endpoints = []

[integrations.telegram]
allowed_chat_ids = []
enabled = false
telegram_key = ""
trusted_chat_ids = []
voice_reply = true

[llm]
agentic_mode = true
connect_timeout_secs = 15
context_compression = true
default_provider = "ollama"
dynamic_model_routing = true
fallback_models = ["anthropic/claude-3-5-sonnet", "gemini/gemini-1.5-pro", "nvidia/meta/llama-3.1-70b-instruct"]
force_use_default_model = false
lm_studio_auto_manage = true
local_stt_cmd = "{python} scripts/transcribe_voice.py {input} --model base"
local_tts_cmd = "{python} scripts/speak.py {text}"
loop_timeout_secs = 600
max_agent_turns = 50
max_model_size_b = 0
max_parallel_tools = 4
max_replan_attempts = 3
max_retries = 2
max_tokens = 32000
max_tool_calls = 30
max_tool_chain_depth = 10
orchestrator_enabled = true
plan_qa_enabled = true
planner_cache_max_entries = 100
planner_cache_ttl_secs = 300
python_path = ""
qa_enabled = true
session_budget_secs = 0
step_qa_enabled = true
timeout_secs = 600
turbo_mode = false

[llm.anthropic]
api_key = ""
base_url = "https://api.anthropic.com/v1"
model = "claude-3-5-sonnet-20240620"
vision = true

[llm.gemini]
api_key = ""
base_url = "https://generativelanguage.googleapis.com/v1beta"
model = "gemini-1.5-pro"
vision = true

[llm.model_preferences]
coding = ["qwen3.6-27b", "qwen3.6", "qwen3.8-27b", "qwen3.8", "deepseek-r1", "gemma-4-31b", "gpt-oss"]
fast_chat = ["gemma-4-e4b", "e4b", "qwen3.5-9b", "glm-4.6v-flash", "glm-4.7-flash", "4b", "9b", "7b", "8b"]
math_reasoning = ["deepseek-r1", "gpt-oss", "qwen3.8", "gemma-4-31b", "qwen3.6", "qwen3.5-9b"]
planning = ["gpt-oss", "claude-opus-reasoning", "reasoning-distilled", "qwen3.8", "deepseek-r1", "qwen3.6"]
qa_review = ["qwen3.8", "gemma-4-31b", "qwen3.6", "deepseek-r1", "muse-glimmer"]
security = ["dolphin", "abliterated", "uncensored", "nous-hermes", "wizard-vicuna", "openhermes", "deepseek-r1", "qwen3.8", "qwen3.6"]
vision = ["vision", "-vl", "vl-", "qwen-vl", "qwen2.5-vl", "glm-4.6v", "minicpm-v", "pixtral", "llava"]

[llm.nvidia]
api_key = ""
base_url = "https://integrate.api.nvidia.com/v1"
model = "meta/llama-3.1-70b-instruct"
vision = true

[llm.ollama]
api_token = ""
base_url = ""
keep_alive = "10m"
model = ""
native_tools = true
planner_model = ""
qa_model = ""
thinking_model_patterns = ["qwen", "qwq", "deepseek-r1", "reasoning"]
